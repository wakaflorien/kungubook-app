                current: { month_end: '2026-11-30', accounts_total: 3480000, assets_total: 3770000, owed_to_me: 110000, i_owe: 3280800, net_worth: 4079200 }
                history:
                  - { month_end: '2026-10-31', accounts_total: 3410000, assets_total: 3790000, owed_to_me: 180000, i_owe: 3423000, net_worth: 3957000 }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /attachments:
    post:
      tags: [Attachments]
      operationId: createAttachment
