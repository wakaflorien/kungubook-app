  # ------------------------------------------------------------------ loans
  /loans:
    get:
      tags: [Loans]
      operationId: listLoans
      summary: List loans
      x-milestone: M4
      x-stories: [US-14]
      parameters:
        - $ref: '#/components/parameters/UpdatedSince'
        - $ref: '#/components/parameters/IncludeDeleted'
        - { name: direction, in: query, schema: { $ref: '#/components/schemas/LoanDirection' } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/LoanState' } }
      responses:
        '200':
          description: Loans with totals
          content:
            application/json:
              schema:
                type: object
                required: [data, totals]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Loan' }
                  totals:
                    type: object
                    required: [i_owe, owed_to_me]
                    properties:
                      i_owe: { $ref: '#/components/schemas/Money' }
                      owed_to_me: { $ref: '#/components/schemas/Money' }
              example:
                totals: { i_owe: { amount: 3280800, currency: RWF }, owed_to_me: { amount: 110000, currency: RWF } }
                data:
                  - id: 0193a1b2-0000-7000-8000-000000000b01
                    direction: borrowed
                    contact_id: 0193a1b2-0000-7000-8000-000000000c01
                    name: BK Term Loan
                    principal: 5000000
                    currency: RWF
                    annual_rate_bp: 1450
                    term_months: 42
                    repayment: monthly
                    installment_amount: 152500
                    start_date: '2025-04-18'
                    first_due_date: '2025-05-18'
                    account_id: 0193a1b2-0000-7000-8000-000000000a03
                    auto_debit: true
                    state: active
                    left_to_pay: 3160800
                    paid_so_far: 2745000
                    installments_paid: 18
                    next_due: { seq: 19, due_date: '2026-11-18', amount: 152500, state: due }
                    created_at: '2025-04-18T08:00:00Z'
                    updated_at: '2026-10-18T07:00:00Z'
                    deleted_at: null
                    version: 19
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Loans]
      operationId: createLoan
      summary: Add money borrowed or lent
      description: The API generates the installment schedule and the reminders. With `disburse_transaction`, it also records the money arriving (borrowed) or leaving (lent).
      x-milestone: M4
      x-stories: [US-14]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/LoanInput'
                - required: [direction, contact_id, name, principal, repayment, start_date, first_due_date]
      responses:
        '201': { $ref: '#/components/responses/Loan' }
        '200': { $ref: '#/components/responses/Loan' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /loans/preview-schedule:
    post:
      tags: [Loans]
      operationId: previewLoanSchedule
      summary: The schedule a loan would get, without saving
      description: Must match `packages/shared/money/amortize`. Reference case — 5,000,000 at 1450 bp over 42 months → installment 152,500; balance after 18 = 3,160,800.
      x-milestone: M4
      x-stories: [US-14]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [principal, repayment, first_due_date]
              properties:
                principal: { type: integer, format: int64, example: 5000000 }
                currency: { $ref: '#/components/schemas/Currency' }
                annual_rate_bp: { type: integer, minimum: 0, example: 1450 }
                term_months: { type: integer, minimum: 1, example: 42 }
                repayment: { $ref: '#/components/schemas/RepaymentType' }
                installment_amount: { type: integer, format: int64, description: Override. }
                first_due_date: { type: string, format: date, example: '2025-05-18' }
      responses:
        '200': { $ref: '#/components/responses/Schedule' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /loans/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Loans]
      operationId: getLoan
      summary: Get loan
      x-milestone: M4
      x-stories: [US-15]
      responses:
        '200': { $ref: '#/components/responses/Loan' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Loans]
      operationId: updateLoan
      summary: Update loan
      description: Changing amount, rate, term or dates regenerates unpaid installments; paid ones stay.
      x-milestone: M4
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoanInput' }
      responses:
        '200': { $ref: '#/components/responses/Loan' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Loans]
      operationId: deleteLoan
      summary: Delete loan
      description: Soft-deletes the loan, its schedule and reminders. Payment transactions stay in Activity.
      x-milestone: M4
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /loans/{id}/schedule:
    get:
      tags: [Loans]
      operationId: getLoanSchedule
      summary: Get loan schedule
      x-milestone: M4
      x-stories: [US-15]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Schedule' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /loans/{id}/payments:
    get:
      tags: [Loans]
      operationId: listLoanPayments
      summary: List loan payments
      x-milestone: M4
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Payments, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LoanPayment' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Loans]
      operationId: recordLoanPayment
      summary: Record a payment made or received
      description: |
        Applied to the oldest unpaid installment first (partial payments allowed). With `account_id`, the API also
        creates the transaction (`out` for borrowed, `in` for lent, `source = loan`) unless `transaction_id` links
        an existing one (e.g. an auto-debit already imported).
      x-milestone: M4
      x-stories: [US-16]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, paid_on]
              properties:
                id: { $ref: '#/components/schemas/Uuid' }
                amount: { type: integer, format: int64, minimum: 1, example: 152500 }
                paid_on: { type: string, format: date }
                account_id: { $ref: '#/components/schemas/Uuid' }
                transaction_id: { $ref: '#/components/schemas/Uuid' }
                note: { type: string }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                required: [payment, loan]
                properties:
                  payment: { $ref: '#/components/schemas/LoanPayment' }
                  loan: { $ref: '#/components/schemas/Loan' }
                  transaction: { $ref: '#/components/schemas/Transaction' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /loans/{id}/settle:
    post:
      tags: [Loans]
      operationId: settleLoan
      summary: Mark a loan settled (paid in full or written off)
      x-milestone: M4
      x-stories: [US-16]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                write_off: { type: boolean, default: false, description: Close without recording the remaining money. }
                final_payment:
                  description: Record the remaining balance as a last payment first.
                  type: object
                  properties:
                    account_id: { $ref: '#/components/schemas/Uuid' }
                    paid_on: { type: string, format: date }
      responses:
        '200': { $ref: '#/components/responses/Loan' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------ calendar
