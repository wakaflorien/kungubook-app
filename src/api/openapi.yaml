      description: Emails sent there are parsed by the backend (inbound webhook, not part of this contract) and land in Review.
      x-milestone: M8
      x-stories: [US-27]
      responses:
        '200':
          description: Address
          content:
            application/json:
              schema:
                type: object
                required: [address, enabled]
                properties:
                  address: { type: string, format: email, example: keza.7f3k@in.kungubook.app }
                  enabled: { type: boolean }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Me]
      operationId: rotateEmailImportAddress
      summary: Turn on, or replace a leaked address
      x-milestone: M8
      responses:
        '200':
          description: New address
          content:
            application/json:
              schema:
                type: object
                required: [address, enabled]
                properties:
                  address: { type: string, format: email }
                  enabled: { type: boolean }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    UpdatedSince:
      name: updated_since
      in: query
      description: Only rows whose `updated_at` is later (sync fallback).
      schema: { type: string, format: date-time }
    IncludeDeleted:
      name: include_deleted
      in: query
      description: Include soft-deleted rows (with `deleted_at` set) so offline caches can remove them.
      schema: { type: boolean, default: false }
    IfMatch:
      name: If-Match
      in: header
      description: The `version` the client last saw. Stale → `409 version_conflict`.
      schema: { type: integer }
    Period:
      name: period
      in: query
      schema: { type: string, enum: [week, month, quarter, year, custom], default: month }
    PeriodDate:
      name: date
      in: query
      description: Any day inside the period (default today). For `custom`, use `from` and `to` instead.
      schema: { type: string, format: date }
    AccountFilter:
      name: account
      in: query
      style: form
      explode: false
      schema: { type: array, items: { $ref: '#/components/schemas/Uuid' } }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Session:
      description: Signed in
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Session' }
    Account:
      description: Account
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Account' }
    TransactionSaved:
      description: Saved; `duplicate` is set when the row looks like one already recorded
      content:
        application/json:
          schema:
            type: object
            required: [transaction]
            properties:
              transaction: { $ref: '#/components/schemas/Transaction' }
              duplicate: { $ref: '#/components/schemas/DuplicateCandidate' }
              applied_rule_id: { $ref: '#/components/schemas/Uuid' }
    Transfer:
      description: Both legs
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Transfer' }
    Import:
      description: Import
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Import' }
    Category:
      description: Category
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Category' }
    Rule:
      description: Rule
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Rule' }
    RuleMatches:
      description: Matching transactions
      content:
        application/json:
          schema:
            type: object
            required: [count, sample]
            properties:
              count: { type: integer }
              sample:
                type: array
                maxItems: 20
                items: { $ref: '#/components/schemas/Transaction' }
    Contact:
      description: Contact
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Contact' }
    Loan:
      description: Loan
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Loan' }
    Schedule:
      description: Installment schedule
      content:
        application/json:
          schema:
            type: object
            required: [installment_amount, total_interest, data]
            properties:
              installment_amount: { type: integer, format: int64, example: 152500 }
              total_interest: { type: integer, format: int64 }
              data:
                type: array
                items: { $ref: '#/components/schemas/Installment' }
    Budget:
      description: Budget
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Budget' }
    Export:
      description: Export job
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Export' }
    Goal:
      description: Goal
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Goal' }
    Project:
      description: Project
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Project' }
    Asset:
      description: Asset
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Asset' }

  schemas:
    # ---------------------------------------------------------------- primitives
    Uuid:
      type: string
      format: uuid
      description: UUID v7, generated by the client.
      example: 0193a1b2-0000-7000-8000-000000000001
    Currency:
      type: string
      pattern: '^[A-Z]{3}$'
      description: ISO-4217 code.
      default: RWF
      example: RWF
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: integer, format: int64, description: Minor units. }
        currency: { $ref: '#/components/schemas/Currency' }
    Provider:
      type: string
      description: Known providers have a parser; others use the generic one.
      enum: [mtn_momo, airtel_money, bk, equity, im_bank, cash, other]
    RowMeta:
      type: object
      required: [created_at, updated_at, deleted_at, version]
      properties:
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
        deleted_at:
          oneOf: [{ type: string, format: date-time }, { type: 'null' }]
          readOnly: true
        version: { type: integer, readOnly: true }
    Page:
      type: object
      required: [data, next_cursor]
      properties:
        data: { type: array, items: {} }
        next_cursor:
          oneOf: [{ type: string }, { type: 'null' }]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string, description: Safe to log; the apps show their own wording. }
            fields:
              type: object
              description: Field name → problem, for `validation_failed`.
              additionalProperties: { type: string }
            server_row:
              description: The current row, for `version_conflict`.
              type: object
          example: { code: validation_failed, message: amount must be greater than 0, fields: { amount: must be greater than 0 } }
    ErrorCode:
      type: string
      enum:
        - validation_failed      # 422
        - unauthorized           # 401 missing/invalid token
        - token_expired          # 401 refresh and retry once
        - invalid_credentials    # 401
        - forbidden              # 403
        - not_found              # 404
        - email_taken            # 409
        - version_conflict       # 409
        - duplicate_reference    # 409 same account + reference
        - account_in_use         # 409
        - contact_in_use         # 409
        - system_category        # 409
        - budget_exists          # 409
        - use_transfer_endpoint  # 409
        - already_committed      # 409
        - link_expired           # 410 reset link
        - upgrade_required       # 426
        - rate_limited           # 429
        - internal               # 500
        - unavailable            # 503

    # ---------------------------------------------------------------- identity
    Session:
      type: object
      required: [access_token, refresh_token, expires_in, user]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, description: Seconds., example: 900 }
        user: { $ref: '#/components/schemas/User' }
        is_new_user: { type: boolean }
    User:
      allOf:
        - $ref: '#/components/schemas/UserInput'
        - type: object
          required: [id, email, display_name, base_currency, timezone, currencies]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            email: { type: string, format: email, example: keza@example.com }
            email_verified: { type: boolean }
            sign_in_methods:
              type: array
              items: { type: string, enum: [password, apple, google] }
            currencies:
              type: array
              description: Extra currencies the user turned on.
              items: { $ref: '#/components/schemas/Currency' }
            created_at: { type: string, format: date-time }
    UserInput:
      type: object
      properties:
        display_name: { type: string, maxLength: 80, example: Keza Uwase }
        country: { type: string, pattern: '^[A-Z]{2}$', default: RW }
        base_currency: { $ref: '#/components/schemas/Currency' }
        timezone: { type: string, default: Africa/Kigali }
        week_starts_on: { type: integer, minimum: 0, maximum: 6, default: 1, description: 0 = Sunday. }
    Settings:
      allOf:
        - $ref: '#/components/schemas/SettingsInput'
        - type: object
          required: [reminder_lead_days, quiet_start, quiet_end, channels, appearance, version]
          properties:
            version: { type: integer, readOnly: true }
    SettingsInput:
      type: object
      properties:
        reminder_lead_days:
          type: array
          items: { type: integer, minimum: 0, maximum: 30 }
          default: [7, 1, 0]
        quiet_start: { type: string, pattern: '^\d{2}:\d{2}$', default: '22:00' }
        quiet_end: { type: string, pattern: '^\d{2}:\d{2}$', default: '07:00' }
        channels:
          type: object
          description: Which channels each reminder type uses.
          propertyNames: { $ref: '#/components/schemas/ReminderType' }
          additionalProperties:
            type: array
            items: { type: string, enum: [push, email] }
          example: { payment_out: [push, email], payment_in: [push], overdue: [push, email], budget: [push], review_inbox: [push] }
        weekly_summary: { type: boolean, default: false }
        analytics_opt_in: { type: boolean, default: false }
        hide_amounts: { type: boolean, default: false }
        appearance: { type: string, enum: [system, light, dark], default: system }
    DeviceInput:
      type: object
      required: [id, platform]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        platform: { type: string, enum: [ios, android, web] }
        push_token: { type: string, description: Expo push token. }
        app_version: { type: string, example: 1.0.0 }
        name: { type: string, example: iPhone 15 }
    Device:
      allOf:
        - $ref: '#/components/schemas/DeviceInput'
        - type: object
          properties:
            last_seen_at: { type: string, format: date-time }

    # ---------------------------------------------------------------- sync
    SyncTable:
      type: string
      enum: [accounts, categories, contacts, transactions, rules, loans, loan_installments, loan_payments, budgets, notifications, user_settings, projects, goals, goal_contributions, assets]
    SyncPull:
      type: object
      required: [changes, cursor, has_more]
      properties:
        changes:
          type: object
          description: Rows per table, deleted rows included (`deleted_at` set). Same shapes as the REST resources.
          propertyNames: { $ref: '#/components/schemas/SyncTable' }
          additionalProperties:
            type: array
            items: { type: object }
        cursor: { type: string }
        has_more: { type: boolean }
    SyncPush:
      type: object
      required: [changes]
      properties:
        changes:
          type: array
          maxItems: 500
          items:
            type: object
            required: [table, op, row]
            properties:
              table: { $ref: '#/components/schemas/SyncTable' }
              op: { type: string, enum: [upsert, delete] }
              row:
                type: object
                required: [id, client_updated_at]
                description: The row's writable fields, plus `version` (the one the client last saw).
                properties:
                  id: { $ref: '#/components/schemas/Uuid' }
                  version: { type: integer }
                  client_updated_at: { type: string, format: date-time }
                additionalProperties: true
    SyncPushResult:
      type: object
      required: [applied, conflicts, rejected]
      properties:
        applied: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
        conflicts:
          description: The server copy won (newer `client_updated_at`); the client replaces its row.
          type: array
          items:
            type: object
            required: [id, server_row]
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              server_row: { type: object }
        rejected:
          description: Invalid changes; the client shows them in a "couldn't sync" list.
          type: array
          items:
            type: object
            required: [id, error]
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              error: { $ref: '#/components/schemas/ErrorCode' }
              message: { type: string }

    # ---------------------------------------------------------------- accounts
    AccountType:
      type: string
      enum: [mobile_money, bank, card, cash]
    AccountInput:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        type: { $ref: '#/components/schemas/AccountType' }
        name: { type: string, maxLength: 60, example: MTN MoMo }
        provider: { $ref: '#/components/schemas/Provider' }
        number_last: { type: string, maxLength: 6, description: 'Last digits, used to match messages.', example: '214' }
        currency: { $ref: '#/components/schemas/Currency' }
        opening_balance: { type: integer, format: int64, default: 0 }
        opening_date: { type: string, format: date }
        include_in_total: { type: boolean, default: true }
        linked_account_id:
          description: For a card, the bank account it draws from.
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
        sort_order: { type: integer }
        archived: { type: boolean, default: false }
    Account:
      allOf:
        - $ref: '#/components/schemas/AccountInput'
        - $ref: '#/components/schemas/RowMeta'
        - type: object
          required: [id, type, name, currency, balance, balance_base, include_in_total]
          properties:
            balance: { type: integer, format: int64, readOnly: true, description: 'Opening balance + confirmed in − confirmed (out + fee). The apps show this, not their own sum.' }
            balance_base: { type: integer, format: int64, readOnly: true, description: In the user's base currency at today's rate. }
            last_reported_balance:
              description: Balance from the latest provider message or statement. Differs from `balance` → mismatch screen (76).
              oneOf: [{ type: integer, format: int64 }, { type: 'null' }]
              readOnly: true
            last_reported_at:
              oneOf: [{ type: string, format: date-time }, { type: 'null' }]
              readOnly: true
            pending_count: { type: integer, readOnly: true, description: Items in Review for this account. }

    # ---------------------------------------------------------------- transactions
    TxnKind:
      type: string
      enum: [in, out]
    TxnStatus:
      type: string
      enum: [pending_review, confirmed]
    TxnSource:
      type: string
      enum: [manual, paste, sms, shortcut, import, email, adjustment, loan]
    TransactionInput:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        account_id: { $ref: '#/components/schemas/Uuid' }
        kind: { $ref: '#/components/schemas/TxnKind' }
        amount: { type: integer, format: int64, minimum: 1, example: 12500 }
        currency: { $ref: '#/components/schemas/Currency' }
        fee: { type: integer, format: int64, minimum: 0, default: 0 }
        occurred_at: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/TxnStatus' }
        category_id:
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
        contact_id:
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
        project_id:
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
        counterparty_text: { type: string, maxLength: 120, example: KIGALI GROCERS 88201 }
        note: { type: string, maxLength: 500 }
        reference: { type: string, maxLength: 64 }
        client_updated_at: { type: string, format: date-time }
    Transaction:
      allOf:
        - $ref: '#/components/schemas/TransactionInput'
        - $ref: '#/components/schemas/RowMeta'
        - type: object
          required: [id, account_id, kind, amount, currency, amount_base, fee, occurred_at, status, source]
          properties:
            amount_base: { type: integer, format: int64, readOnly: true, description: In the user's base currency at `occurred_at`'s rate. }
            source: { $ref: '#/components/schemas/TxnSource' }
            balance_after:
              description: As reported by the provider.
              oneOf: [{ type: integer, format: int64 }, { type: 'null' }]
            source_hash:
              oneOf: [{ type: string }, { type: 'null' }]
            transfer_group_id:
              description: Set on both legs of a transfer.
              oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
            split_parent_id:
              oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
            has_parts: { type: boolean, readOnly: true }
            import_id:
              oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
            rule_id:
              oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
            merged_into_id:
              oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
            loan_payment_id:
              oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
            attachment_count: { type: integer, readOnly: true }
    TransferInput:
      type: object
      required: [from_account_id, to_account_id, amount, occurred_at]
      properties:
        group_id: { $ref: '#/components/schemas/Uuid' }
        out_id: { $ref: '#/components/schemas/Uuid' }
        in_id: { $ref: '#/components/schemas/Uuid' }
        from_account_id: { $ref: '#/components/schemas/Uuid' }
        to_account_id: { $ref: '#/components/schemas/Uuid' }
        amount: { type: integer, format: int64, minimum: 1, description: Amount leaving the source account (before fee). }
        received_amount: { type: integer, format: int64, minimum: 1, description: Only when the accounts use different currencies. }
        fee: { type: integer, format: int64, minimum: 0, default: 0 }
        occurred_at: { type: string, format: date-time }
        note: { type: string, maxLength: 500 }
        reference: { type: string }
    Transfer:
      type: object
      required: [group_id, out, in]
      properties:
        group_id: { $ref: '#/components/schemas/Uuid' }
        out: { $ref: '#/components/schemas/Transaction' }
        in: { $ref: '#/components/schemas/Transaction' }

    # ---------------------------------------------------------------- capture & duplicates
    ParsedMessage:
      type: object
      required: [id, source, source_hash, parser, kind, amount, currency, occurred_at]
      description: Output of the on-device parser. Never contains the raw message.
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        source: { type: string, enum: [paste, sms, shortcut] }
        source_hash: { type: string, pattern: '^[a-f0-9]{64}$', description: sha256 of the normalized message. }
        parser: { type: string, example: mtn_momo@3 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        account_id:
          description: Matched on the device from sender + `number_last`; null lets the API match by provider.
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
        provider: { $ref: '#/components/schemas/Provider' }
        kind: { $ref: '#/components/schemas/TxnKind' }
        amount: { type: integer, format: int64, minimum: 1, example: 25000 }
        currency: { $ref: '#/components/schemas/Currency' }
        fee: { type: integer, format: int64, minimum: 0, default: 0 }
        occurred_at: { type: string, format: date-time }
        counterparty_text: { type: string, example: Patrick Kamanzi }
        counterparty_phone: { type: string, description: E.164; matched against contacts. }
        reference: { type: string, example: '81234567890' }
        balance_after: { type: integer, format: int64 }
        transfer_hint:
          description: The parser thinks this is a move to another of the user's accounts.
          type: boolean
    DuplicateStrength:
      type: string
      enum: [certain, likely, possible]
      description: 'certain: same reference or source_hash · likely: same account, kind, amount within ±1 day and similar counterparty · possible: same amount within ±1 day.'
    DuplicateResolution:
      type: string
      enum: [open, merged, kept_both, discarded]
    DuplicateCandidate:
      type: object
      required: [id, strength, resolution, new_transaction, existing_transaction, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        strength: { $ref: '#/components/schemas/DuplicateStrength' }
        resolution: { $ref: '#/components/schemas/DuplicateResolution' }
        reasons:
          type: array
          items: { type: string, enum: [same_reference, same_hash, same_amount, same_day, near_day, same_counterparty, same_account] }
        new_transaction: { $ref: '#/components/schemas/Transaction' }
        existing_transaction: { $ref: '#/components/schemas/Transaction' }
        resolved_at:
          oneOf: [{ type: string, format: date-time }, { type: 'null' }]
        created_at: { type: string, format: date-time }

    # ---------------------------------------------------------------- imports
    ImportState:
      type: string
      enum: [uploaded, parsing, needs_password, needs_mapping, ready, committed, failed]
    ImportRowState:
      type: string
      enum: [new, already_recorded, needs_review, skipped, imported]
    Import:
      type: object
      required: [id, account_id, institution, file_name, file_type, state, rows_total, rows_new, rows_existing, rows_review, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        account_id: { $ref: '#/components/schemas/Uuid' }
        institution: { $ref: '#/components/schemas/Provider' }
        file_name: { type: string }
        file_type: { type: string, enum: [csv, xlsx, pdf] }
        state: { $ref: '#/components/schemas/ImportState' }
        period_from: { oneOf: [{ type: string, format: date }, { type: 'null' }] }
        period_to: { oneOf: [{ type: string, format: date }, { type: 'null' }] }
        rows_total: { type: integer }
        rows_new: { type: integer }
        rows_existing: { type: integer }
        rows_review: { type: integer }
        detected_columns:
          description: Headers found, when `state = needs_mapping`.
          type: array
          items: { type: string }
        suggested_mapping: { $ref: '#/components/schemas/ColumnMapping' }
        closing_balance: { type: integer, format: int64, description: 'From the statement, used for the mismatch check.' }
        error: { oneOf: [{ type: string }, { type: 'null' }] }
        committed_at: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        created_at: { type: string, format: date-time }
    ImportRow:
      type: object
      required: [id, row_number, occurred_at, description, kind, amount, state]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        row_number: { type: integer }
        occurred_at: { type: string, format: date-time }
        description: { type: string }
        kind: { $ref: '#/components/schemas/TxnKind' }
        amount: { type: integer, format: int64 }
        fee: { type: integer, format: int64 }
        reference: { oneOf: [{ type: string }, { type: 'null' }] }
        balance_after: { oneOf: [{ type: integer, format: int64 }, { type: 'null' }] }
        state: { $ref: '#/components/schemas/ImportRowState' }
        matched_transaction: { $ref: '#/components/schemas/Transaction' }
        duplicate_strength: { $ref: '#/components/schemas/DuplicateStrength' }
    ColumnMapping:
      type: object
      description: Statement column name for each field. Use `amount` + `kind_column`, or `debit` + `credit`.
      properties:
        date: { type: string, example: Value date }
        description: { type: string, example: Narrative }
        amount: { type: string }
        debit: { type: string, example: Debit }
        credit: { type: string, example: Credit }
        kind_column: { type: string }
        reference: { type: string, example: Reference }
        balance: { type: string, example: Balance }
        fee: { type: string }
        date_format: { type: string, example: DD/MM/YYYY }
        skip_rows: { type: integer, minimum: 0 }
    StatementMapping:
      type: object
      required: [institution, file_type, columns]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        institution: { $ref: '#/components/schemas/Provider' }
        file_type: { type: string, enum: [csv, xlsx, pdf] }
        columns: { $ref: '#/components/schemas/ColumnMapping' }
        updated_at: { type: string, format: date-time, readOnly: true }

    # ---------------------------------------------------------------- categories & rules
    CategoryInput:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, maxLength: 40, example: Food & Groceries }
        direction: { $ref: '#/components/schemas/TxnKind' }
        icon: { type: string, description: Material Symbols Rounded name., example: shopping_cart }
        sort_order: { type: integer }
    Category:
      allOf:
        - $ref: '#/components/schemas/CategoryInput'
        - $ref: '#/components/schemas/RowMeta'
        - type: object
          required: [id, name, direction, icon, is_system]
          properties:
            is_system: { type: boolean, readOnly: true, description: 'Seeded default; can be renamed, not deleted.' }
    RuleInput:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        priority: { type: integer, default: 100, description: Lower runs first; first match wins. }
        match_text: { type: string, minLength: 2, description: Case-insensitive "contains" on counterparty and description., example: KIGALI GROCERS }
        match_kind:
          description: null = any. `transfer` matches rows the parser flagged as transfers.
          oneOf: [{ type: string, enum: [in, out, transfer] }, { type: 'null' }]
        match_account_id:
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
        set_category_id:
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
        set_project_id:
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
        set_contact_id:
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
        auto_confirm: { type: boolean, default: false, description: Skip Review for matches (never when a duplicate is open). }
    Rule:
      allOf:
        - $ref: '#/components/schemas/RuleInput'
        - $ref: '#/components/schemas/RowMeta'
        - type: object
          required: [id, match_text, priority, auto_confirm]
          properties:
            match_count: { type: integer, readOnly: true }

    # ---------------------------------------------------------------- contacts
    ContactInput:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [person, company], default: person }
        name: { type: string, maxLength: 80, example: Eric Mugisha }
        role: { type: string, maxLength: 40, example: Friend }
        phones:
          type: array
          items: { type: string, pattern: '^\+[1-9]\d{6,14}$' }
          example: ['+250788000111']
        aliases: { type: array, items: { type: string } }
        default_account_id:
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
        note: { type: string, maxLength: 500 }
        reminders_on: { type: boolean, default: true }
    Contact:
      allOf:
        - $ref: '#/components/schemas/ContactInput'
        - $ref: '#/components/schemas/RowMeta'
        - type: object
          required: [id, kind, name]
          properties:
            i_owe: { type: integer, format: int64, readOnly: true, description: Open loans borrowed from this contact. }
            owes_me: { type: integer, format: int64, readOnly: true }
            paid_total: { type: integer, format: int64, readOnly: true, description: 'All-time out to this contact, transfers excluded.' }
            received_total: { type: integer, format: int64, readOnly: true }
            last_activity_at: { oneOf: [{ type: string, format: date-time }, { type: 'null' }], readOnly: true }

    # ---------------------------------------------------------------- loans
    LoanDirection:
      type: string
      enum: [borrowed, lent]
    LoanState:
      type: string
      enum: [active, settled, written_off]
    RepaymentType:
      type: string
      enum: [one_off, monthly, custom]
    LoanInput:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        direction: { $ref: '#/components/schemas/LoanDirection' }
        contact_id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, maxLength: 60, example: BK Term Loan }
        principal: { type: integer, format: int64, minimum: 1, example: 5000000 }
        currency: { $ref: '#/components/schemas/Currency' }
        annual_rate_bp: { type: integer, minimum: 0, default: 0, description: 'Basis points: 14.5% = 1450.', example: 1450 }
        term_months: { type: integer, minimum: 1, example: 42 }
        repayment: { $ref: '#/components/schemas/RepaymentType' }
        installment_amount: { type: integer, format: int64, description: 'Calculated if omitted (amortized, rounded to 100).' }
        custom_schedule:
          description: For `repayment = custom`.
          type: array
          items:
            type: object
            required: [due_date, amount]
            properties:
              due_date: { type: string, format: date }
              amount: { type: integer, format: int64, minimum: 1 }
        start_date: { type: string, format: date }
        first_due_date: { type: string, format: date }
        account_id:
          description: Paid from (borrowed) or received into (lent).
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
        auto_debit: { type: boolean, default: false }
        note: { type: string, maxLength: 500 }
        disburse_transaction: { type: boolean, default: false, writeOnly: true, description: 'On create, also record the principal moving in or out of `account_id`.' }
        already_paid_installments: { type: integer, minimum: 0, writeOnly: true, description: 'On create, for a loan that started earlier; marks the first N installments paid without transactions.' }
    Loan:
      allOf:
        - $ref: '#/components/schemas/LoanInput'
        - $ref: '#/components/schemas/RowMeta'
        - type: object
          required: [id, direction, contact_id, name, principal, currency, repayment, state, left_to_pay, paid_so_far]
          properties:
            state: { $ref: '#/components/schemas/LoanState' }
            left_to_pay: { type: integer, format: int64, readOnly: true, description: Principal left (see doc 05 §4). }
            paid_so_far: { type: integer, format: int64, readOnly: true, description: Total paid including interest. }
            installments_paid: { type: integer, readOnly: true }
            installments_total: { type: integer, readOnly: true }
            next_due:
              oneOf: [{ $ref: '#/components/schemas/Installment' }, { type: 'null' }]
              readOnly: true
            overdue_amount: { type: integer, format: int64, readOnly: true }
            settled_at: { oneOf: [{ type: string, format: date-time }, { type: 'null' }], readOnly: true }
    InstallmentState:
      type: string
      enum: [upcoming, due, paid, overdue, partial]
    Installment:
      type: object
      required: [seq, due_date, amount, state]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        seq: { type: integer, example: 19 }
        due_date: { type: string, format: date }
        amount: { type: integer, format: int64, example: 152500 }
        interest_part: { type: integer, format: int64 }
        principal_part: { type: integer, format: int64 }
        balance_after: { type: integer, format: int64 }
        paid_amount: { type: integer, format: int64 }
        state: { $ref: '#/components/schemas/InstallmentState' }
    LoanPayment:
      allOf:
        - $ref: '#/components/schemas/RowMeta'
        - type: object
          required: [id, loan_id, amount, paid_on]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            loan_id: { $ref: '#/components/schemas/Uuid' }
            amount: { type: integer, format: int64 }
            paid_on: { type: string, format: date }
            transaction_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
            note: { type: string }

    # ---------------------------------------------------------------- calendar
    CalendarItem:
      type: object
      required: [date, type, direction, amount, currency, title, deep_link]
      properties:
        date: { type: string, format: date }
        type: { type: string, enum: [installment, expected_payment, budget_reset, goal_plan] }
        direction: { type: string, enum: [in, out] }
        state: { $ref: '#/components/schemas/InstallmentState' }
        amount: { type: integer, format: int64 }
        currency: { $ref: '#/components/schemas/Currency' }
        title: { type: string, example: BK Term Loan · 19 of 42 }
        loan_id: { $ref: '#/components/schemas/Uuid' }
        contact_id: { $ref: '#/components/schemas/Uuid' }
        deep_link: { type: string, example: 'kungubook://loans/0193a1b2-0000-7000-8000-000000000b01' }

    # ---------------------------------------------------------------- budgets
    BudgetInput:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        category_id: { $ref: '#/components/schemas/Uuid' }
        amount: { type: integer, format: int64, minimum: 1, description: Monthly limit in the base currency., example: 250000 }
        thresholds:
          type: array
          items: { type: integer, minimum: 1, maximum: 200 }
          default: [80, 100]
        rollover: { type: boolean, default: false, description: v1.1 }
        starts_month: { type: string, pattern: '^\d{4}-\d{2}$' }
    Budget:
      allOf:
        - $ref: '#/components/schemas/BudgetInput'
        - $ref: '#/components/schemas/RowMeta'
        - type: object
          required: [id, category_id, amount, thresholds]

    # ---------------------------------------------------------------- notifications & exports
    ReminderType:
      type: string
      enum: [payment_out, payment_in, overdue, budget, review_inbox, balance_mismatch, goal, weekly_summary]
    Notification:
      type: object
      required: [id, type, title, body, deep_link, read_at, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        type: { $ref: '#/components/schemas/ReminderType' }
        title: { type: string, example: BK Term Loan due tomorrow }
        body: { type: string, example: 'RWF 152,500 from BK Current.' }
        deep_link: { type: string, example: 'kungubook://loans/0193a1b2-0000-7000-8000-000000000b01' }
        read_at: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        created_at: { type: string, format: date-time }
    Export:
      type: object
      required: [id, state, format]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        state: { type: string, enum: [queued, running, ready, failed] }
        format: { type: string, enum: [pdf, csv] }
        download_url: { oneOf: [{ type: string, format: uri }, { type: 'null' }] }
        expires_at: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        error: { oneOf: [{ type: string }, { type: 'null' }] }

    # ---------------------------------------------------------------- v1.1
    GoalInput:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, maxLength: 60, example: Emergency fund }
        target: { type: integer, format: int64, minimum: 1, example: 1500000 }
        currency: { $ref: '#/components/schemas/Currency' }
        deadline: { type: string, format: date }
        account_id:
          description: Where the money is kept. Goal money is never added to net worth twice.
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
        monthly_plan: { type: integer, format: int64 }
        plan_day: { type: integer, minimum: 1, maximum: 28 }
    Goal:
      allOf:
        - $ref: '#/components/schemas/GoalInput'
        - $ref: '#/components/schemas/RowMeta'
        - type: object
          required: [id, name, target, saved, status]
          properties:
            saved: { type: integer, format: int64, readOnly: true, example: 900000 }
            status: { type: string, enum: [on_track, behind, done], readOnly: true }
    ProjectInput:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [project, business], default: project }
        name: { type: string, maxLength: 60, example: Shop renovation }
        place: { type: string }
        budget: { type: integer, format: int64 }
        currency: { $ref: '#/components/schemas/Currency' }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        status: { type: string, enum: [active, paused, done], default: active }
        note: { type: string }
    Project:
      allOf:
        - $ref: '#/components/schemas/ProjectInput'
        - $ref: '#/components/schemas/RowMeta'
        - type: object
          required: [id, kind, name, status, spent, earned]
          properties:
            spent: { type: integer, format: int64, readOnly: true }
            earned: { type: integer, format: int64, readOnly: true }
            asset_value: { type: integer, format: int64, readOnly: true }
    AssetInput:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, maxLength: 60, example: Work laptop }
        category: { type: string, example: Electronics }
        purchase_price: { type: integer, format: int64, minimum: 0, example: 1850000 }
        currency: { $ref: '#/components/schemas/Currency' }
        bought_on: { type: string, format: date }
        current_value: { type: integer, format: int64, minimum: 0, example: 1150000 }
        valued_on: { type: string, format: date }
        transaction_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        project_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        note: { type: string }
        sold_at: { oneOf: [{ type: string, format: date }, { type: 'null' }] }
    Asset:
      allOf:
        - $ref: '#/components/schemas/AssetInput'
        - $ref: '#/components/schemas/RowMeta'
        - type: object
          required: [id, name, category, purchase_price, bought_on, current_value]
    NetWorthPoint:
      type: object
      required: [month_end, accounts_total, assets_total, owed_to_me, i_owe, net_worth]
      properties:
        month_end: { type: string, format: date }
        accounts_total: { type: integer, format: int64 }
        assets_total: { type: integer, format: int64 }
        owed_to_me: { type: integer, format: int64 }
        i_owe: { type: integer, format: int64 }
