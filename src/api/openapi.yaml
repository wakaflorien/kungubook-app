  /fx:
    get:
      tags: [FX]
      operationId: getFxRate
      summary: Get fx rate
      x-milestone: M6
      x-stories: [US-24]
      parameters:
        - { name: base, in: query, required: true, schema: { $ref: '#/components/schemas/Currency' } }
        - { name: quote, in: query, required: true, schema: { $ref: '#/components/schemas/Currency' } }
        - { name: day, in: query, description: Defaults to today; falls back to the latest earlier rate., schema: { type: string, format: date } }
      responses:
        '200':
          description: 1 base = rate quote
          content:
            application/json:
              schema:
                type: object
                required: [day, base, quote, rate]
