openapi: 3.1.0
info:
  title: KunguBook API
  version: 0.1.0-draft
  summary: Draft contract for the standalone KunguBook backend.
  description: |
    **Status: draft, written by the app team.** This spec is what the KunguBook apps expect. Until the
    backend publishes its own spec, the apps generate `packages/api-client` from this file and run the
    Prism mock server from it (`pnpm mock`). When the backend's spec exists, it replaces this file and
    CI compares the two with `oasdiff`.

    Read with [05 · API Contract & Data Model](05-backend-schema.md) (rules, data model) and the
    [TRD](02-trd.md) (sync, duplicates, reminders, security).

    ## Conventions
    - **Base URL** `https://api.kungubook.app/v1`. JSON only, UTF-8, `snake_case` fields.
    - **Auth:** `Authorization: Bearer <access token>` on every route except `/auth/*` and `/health`.
      Access tokens live 15 minutes; refresh tokens 60 days and rotate on every use.
    - **App version:** the apps send `X-App-Version: 1.2.0 (ios)`. Too old → `426 upgrade_required`.
    - **IDs** are UUID v7 generated by the client. `POST` with an `id` that already exists for this user
      returns `200` with the existing row instead of `201` (safe retries).
    - **Money** is an integer in minor units (`int64`) with an ISO-4217 `currency`. RWF has 0 decimals, so
      `152500` means RWF 152,500. Amounts are always positive; direction comes from `kind`.
    - **Dates:** instants are RFC 3339 with offset (`2026-11-17T09:42:10Z`); calendar days are `YYYY-MM-DD`
      in the user's time zone (default `Africa/Kigali`).
    - **Lists** are cursor-paginated: `?cursor=&limit=50` (max 200) → `{ data: [...], next_cursor }`.
      Every list also accepts `updated_since` and `include_deleted=true` (the sync fallback in TRD §4).
    - **Every row** carries `created_at`, `updated_at`, `deleted_at` (soft delete) and `version`.
      `PATCH` may send `If-Match: <version>`; a stale version → `409 version_conflict` with the server row.
    - **Pending items** (`status: pending_review`) are excluded from every balance, total, budget and insight.
    - **Transfers** are two transactions (an `out` leg and an `in` leg) sharing `transfer_group_id`.
      They count in balances but never in income, spending, budgets or insights.
    - **Privacy:** raw message text is never sent. Capture sends parsed fields plus `source_hash`
      (sha256 of the normalized message).
    - **Errors:** `{ "error": { "code", "message", "fields"? } }`, codes in `ErrorCode`.
    - **Rate limits:** `429 rate_limited` with `Retry-After`. Auth routes: 10 requests/minute per IP.

    `x-milestone` on each operation is the app milestone that needs it (Implementation Plan §3);
    `x-stories` lists the PRD stories it serves.
  license:
    name: Proprietary
    url: https://kungubook.app/terms
  contact:
    name: KunguBook app team
    url: https://kungubook.app
servers:
  - url: https://api.kungubook.app/v1
    description: Production
  - url: https://staging-api.kungubook.app/v1
    description: Staging
  - url: http://localhost:4010
    description: Local Prism mock (`pnpm mock`)
security:
  - bearer: []
tags:
  - name: Auth
    description: Sign-up, sign-in, tokens and password recovery
  - name: Me
    description: The signed-in user, settings, devices and currencies
  - name: Sync
    description: Offline sync (pull changes, push local edits)
  - name: Accounts
    description: Mobile money, bank, card and cash accounts
  - name: Transactions
    description: Income, spending, transfers and splits
  - name: Capture
    description: Messages parsed on the device
  - name: Duplicates
    description: Possible duplicate pairs and their resolution
  - name: Imports
    description: Bank and mobile-money statement imports
  - name: Categories
    description: Income and spending categories
  - name: Rules
    description: Auto-categorization rules
  - name: Contacts
    description: People and companies the user deals with
  - name: Loans
    description: Money borrowed and lent, schedules and payments
  - name: Calendar
    description: Money due in and out by day
  - name: Budgets
    description: Monthly limits per category
  - name: Insights
    description: Totals, cash flow and category breakdowns
  - name: Notifications
    description: In-app notification centre
  - name: Exports
    description: PDF and CSV exports
  - name: FX
    description: Daily exchange rates
  - name: System
    description: Health and version checks
  - name: Goals
    description: v1.1 · Goals
  - name: Projects
    description: v1.1 · Projects
  - name: Assets
    description: v1.1 · Assets
  - name: Net worth
    description: v1.1 · Net worth
  - name: Attachments
    description: v1.1 · Attachments

paths:
  # ------------------------------------------------------------------ system
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Liveness check
      security: []
      x-milestone: M0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
                  min_app_version: { type: string, example: 1.0.0 }

  # ------------------------------------------------------------------ auth
  /auth/signup:
    post:
      tags: [Auth]
      operationId: signup
      summary: Create an account with email and password
      security: []
      x-milestone: M1
      x-stories: [US-01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, display_name]
              properties:
                email: { type: string, format: email, example: keza@example.com }
                password: { type: string, minLength: 8, maxLength: 128 }
                display_name: { type: string, maxLength: 80, example: Keza Uwase }
                base_currency: { $ref: '#/components/schemas/Currency' }
                timezone: { type: string, default: Africa/Kigali }
                device: { $ref: '#/components/schemas/DeviceInput' }
      responses:
        '201': { $ref: '#/components/responses/Session' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in with email and password
      security: []
      x-milestone: M1
      x-stories: [US-02]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                device: { $ref: '#/components/schemas/DeviceInput' }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /auth/apple:
    post:
      tags: [Auth]
      operationId: loginApple
      summary: Sign in or sign up with Apple
      description: The app signs in on the device and sends Apple's identity token. The API verifies it and links or creates the user.
      security: []
      x-milestone: M1
      x-stories: [US-01, US-02]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identity_token]
              properties:
                identity_token: { type: string }
                display_name: { type: string, description: Only sent on first Apple sign-in. }
                device: { $ref: '#/components/schemas/DeviceInput' }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /auth/google:
    post:
      tags: [Auth]
      operationId: loginGoogle
      summary: Sign in or sign up with Google
      security: []
      x-milestone: M1
      x-stories: [US-01, US-02]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token: { type: string }
                device: { $ref: '#/components/schemas/DeviceInput' }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Swap a refresh token for a new token pair
      description: The old refresh token is revoked. Reusing a revoked token revokes every session of that user (theft detection).
      security: []
      x-milestone: M0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current session
      x-milestone: M1
      x-stories: [US-24]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
                all_devices: { type: boolean, default: false }
      responses:
        '204': { description: Signed out }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /auth/password/forgot:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Email a reset link (valid 1 hour)
      description: Always returns 204, whether or not the email exists.
      security: []
      x-milestone: M1
      x-stories: [US-02]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '204': { description: Sent if the account exists }
        '429': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /auth/password/reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password from a reset link
      description: Revokes every existing session.
      security: []
      x-milestone: M1
      x-stories: [US-02]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '204': { description: Password changed }
        '410': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /auth/verify-password:
    post:
      tags: [Auth]
      operationId: verifyPassword
      summary: Re-check the password (forgot PIN, delete account)
      x-milestone: M1
      x-stories: [US-03]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        '204': { description: Correct }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------ me
  /me:
    get:
      tags: [Me]
      operationId: getMe
      summary: Get me
      x-milestone: M1
      responses:
        '200':
          description: The signed-in user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Me]
      operationId: updateMe
      summary: Update me
      x-milestone: M1
      x-stories: [US-24]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Me]
      operationId: deleteMe
      summary: Schedule account deletion
      description: Signs out everywhere, hides the data now and hard-deletes it after 30 days. Signing in within 30 days cancels.
      x-milestone: M6
      x-stories: [US-24]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string, description: Required for password accounts. }
                reason: { type: string, maxLength: 500 }
      responses:
        '202': { description: Deletion scheduled }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /me/settings:
    get:
      tags: [Me]
      operationId: getSettings
      summary: Get settings
      x-milestone: M1
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Me]
      operationId: updateSettings
      summary: Update settings
      x-milestone: M5
      x-stories: [US-19, US-20, US-24]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingsInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /me/currencies:
    put:
      tags: [Me]
      operationId: setCurrencies
      summary: Replace the list of extra currencies the user turned on
      x-milestone: M6
      x-stories: [US-24]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currencies]
              properties:
                currencies:
                  type: array
                  items: { $ref: '#/components/schemas/Currency' }
                  example: [USD, EUR]
      responses:
        '204': { description: Saved }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /me/devices:
    post:
      tags: [Me]
      operationId: registerDevice
      summary: Register or refresh this phone's push token
      x-milestone: M1
      x-stories: [US-19]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceInput' }
      responses:
        '200':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /me/devices/{id}:
    delete:
      tags: [Me]
      operationId: deleteDevice
      summary: Stop push to a device (sign-out, disabled notifications)
      x-milestone: M5
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------ sync
  /sync/pull:
    get:
      tags: [Sync]
      operationId: syncPull
      summary: Every row changed since a cursor, deletes included
      description: If the backend can't offer sync, the apps fall back to `updated_since` + `include_deleted` on each list (TRD §4).
      x-milestone: M2
      parameters:
        - name: since
          in: query
          description: Cursor from the last pull. Omit for a full download.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 2000, default: 500 }
      responses:
        '200':
          description: Changes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncPull' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /sync/push:
    post:
      tags: [Sync]
      operationId: syncPush
      summary: Apply offline changes (last write wins per row)
      x-milestone: M2
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncPush' }
      responses:
        '200':
          description: Result per change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncPushResult' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------ accounts
  /accounts:
    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: List accounts
      x-milestone: M1
      x-stories: [US-04]
      parameters:
        - $ref: '#/components/parameters/UpdatedSince'
        - $ref: '#/components/parameters/IncludeDeleted'
        - name: include_archived
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: All accounts (not paginated; a user has few)
          content:
            application/json:
              schema:
                type: object
                required: [data, total]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Account' }
                  total:
                    description: Sum of `balance_base` for accounts with `include_in_total`.
                    $ref: '#/components/schemas/Money'
              example:
                total: { amount: 3480000, currency: RWF }
                data:
                  - { id: 0193a1b2-0000-7000-8000-000000000a01, type: mobile_money, name: MTN MoMo, provider: mtn_momo, number_last: '214', currency: RWF, opening_balance: 0, opening_date: '2026-01-01', include_in_total: true, balance: 412400, balance_base: 412400, last_reported_balance: 412400, sort_order: 0, created_at: '2026-01-01T08:00:00Z', updated_at: '2026-11-17T09:42:10Z', deleted_at: null, version: 14 }
                  - { id: 0193a1b2-0000-7000-8000-000000000a02, type: mobile_money, name: Airtel Money, provider: airtel_money, number_last: '908', currency: RWF, opening_balance: 0, opening_date: '2026-01-01', include_in_total: true, balance: 145000, balance_base: 145000, last_reported_balance: 150000, sort_order: 1, created_at: '2026-01-01T08:00:00Z', updated_at: '2026-11-16T18:10:00Z', deleted_at: null, version: 9 }
                  - { id: 0193a1b2-0000-7000-8000-000000000a03, type: bank, name: BK Current, provider: bk, number_last: '5521', currency: RWF, opening_balance: 0, opening_date: '2026-01-01', include_in_total: true, balance: 1240000, balance_base: 1240000, sort_order: 2, created_at: '2026-01-01T08:00:00Z', updated_at: '2026-11-17T07:00:00Z', deleted_at: null, version: 22 }
                  - { id: 0193a1b2-0000-7000-8000-000000000a04, type: bank, name: Equity Savings, provider: equity, number_last: '0377', currency: RWF, opening_balance: 0, opening_date: '2026-01-01', include_in_total: true, balance: 1620000, balance_base: 1620000, sort_order: 3, created_at: '2026-01-01T08:00:00Z', updated_at: '2026-11-01T07:00:00Z', deleted_at: null, version: 6 }
                  - { id: 0193a1b2-0000-7000-8000-000000000a05, type: cash, name: Cash, provider: cash, currency: RWF, opening_balance: 0, opening_date: '2026-01-01', include_in_total: true, balance: 62600, balance_base: 62600, sort_order: 4, created_at: '2026-01-01T08:00:00Z', updated_at: '2026-11-15T12:00:00Z', deleted_at: null, version: 30 }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Create account
      x-milestone: M1
      x-stories: [US-04]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/AccountInput'
                - required: [type, name, currency]
      responses:
        '201': { $ref: '#/components/responses/Account' }
        '200': { $ref: '#/components/responses/Account' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /accounts/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: Get account
      x-milestone: M1
      responses:
        '200': { $ref: '#/components/responses/Account' }
        '404': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Accounts]
      operationId: updateAccount
      summary: Update account
      x-milestone: M1
      x-stories: [US-04]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountInput' }
      responses:
        '200': { $ref: '#/components/responses/Account' }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Accounts]
      operationId: deleteAccount
      summary: Delete account
      description: 'Soft delete. Refused with `409 account_in_use` while it has transactions; archive it instead (`PATCH archived: true`).'
      x-milestone: M1
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /accounts/{id}/balance-history:
    get:
      tags: [Accounts]
      operationId: getBalanceHistory
      summary: Get balance history
      x-milestone: M2
      x-stories: [US-04]
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: range
          in: query
          schema: { type: string, enum: [30d, 90d, 1y], default: 30d }
      responses:
        '200':
          description: End-of-day balances
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [day, balance]
                      properties:
                        day: { type: string, format: date }
                        balance: { type: integer, format: int64 }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /accounts/{id}/adjust:
    post:
      tags: [Accounts]
      operationId: adjustBalance
      summary: Fix a balance mismatch with an adjustment transaction
      description: Creates one confirmed transaction with `source = adjustment` for the difference, and clears the mismatch.
      x-milestone: M3
      x-stories: [US-05]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actual_balance]
              properties:
                id: { $ref: '#/components/schemas/Uuid' }
                actual_balance: { type: integer, format: int64, example: 150000 }
                note: { type: string }
      responses:
        '200':
          description: The adjustment (null when nothing changed) and the new account
          content:
            application/json:
              schema:
                type: object
                required: [account]
                properties:
                  transaction:
                    oneOf:
                      - $ref: '#/components/schemas/Transaction'
                      - type: 'null'
                  account: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------ transactions
  /transactions:
    get:
      tags: [Transactions]
      operationId: listTransactions
      summary: Activity, newest first
      x-milestone: M2
      x-stories: [US-07]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/UpdatedSince'
        - $ref: '#/components/parameters/IncludeDeleted'
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, description: Inclusive., schema: { type: string, format: date } }
        - { name: account, in: query, style: form, explode: false, schema: { type: array, items: { $ref: '#/components/schemas/Uuid' } } }
        - { name: kind, in: query, description: '`transfer` returns rows with a `transfer_group_id`.', schema: { type: string, enum: [in, out, transfer] } }
        - { name: source, in: query, schema: { $ref: '#/components/schemas/TxnSource' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TxnStatus' } }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: contact, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: project, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: q, in: query, description: 'Searches note, counterparty, contact, category and reference.', schema: { type: string } }
      responses:
        '200':
          description: A page of transactions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Transaction' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Transactions]
      operationId: createTransaction
      summary: Record income or spending
      description: |
        Applies rules (category, contact, project) unless the client set them, converts to `amount_base`,
        and runs the duplicate check. A possible duplicate is returned in `duplicate`; the row is still saved.
      x-milestone: M2
      x-stories: [US-06]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/TransactionInput'
                - required: [account_id, kind, amount, occurred_at]
      responses:
        '201': { $ref: '#/components/responses/TransactionSaved' }
        '200': { $ref: '#/components/responses/TransactionSaved' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /transactions/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Transactions]
      operationId: getTransaction
      summary: Get transaction
      x-milestone: M2
      responses:
        '200':
          description: The transaction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '404': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Transactions]
      operationId: updateTransaction
      summary: Update transaction
      description: Editing one leg of a transfer is refused (`409 use_transfer_endpoint`); use `PATCH /transfers/{group_id}`.
      x-milestone: M2
      x-stories: [US-08]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Transactions]
      operationId: deleteTransaction
      summary: Delete transaction
      description: Soft delete. Deleting a split parent deletes its parts. Deleting a transfer leg deletes both legs.
      x-milestone: M2
      x-stories: [US-08]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /transactions/{id}/split:
    post:
      tags: [Transactions]
      operationId: splitTransaction
      summary: Split one transaction across categories
      description: The parts must add up to the parent's amount. The parent stays for the account balance; totals use the parts.
      x-milestone: M2
      x-stories: [US-08]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parts]
              properties:
                parts:
                  type: array
                  minItems: 2
                  items:
                    type: object
                    required: [amount, category_id]
                    properties:
                      id: { $ref: '#/components/schemas/Uuid' }
                      amount: { type: integer, format: int64, minimum: 1 }
                      category_id: { $ref: '#/components/schemas/Uuid' }
                      note: { type: string }
      responses:
        '200':
          description: The parent with its parts
          content:
            application/json:
              schema:
                type: object
                required: [parent, parts]
                properties:
                  parent: { $ref: '#/components/schemas/Transaction' }
                  parts:
                    type: array
                    items: { $ref: '#/components/schemas/Transaction' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /transactions/{id}/confirm:
    post:
      tags: [Transactions]
      operationId: confirmTransaction
      summary: Move a pending item out of Review
      x-milestone: M3
      x-stories: [US-11]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                changes: { $ref: '#/components/schemas/TransactionInput' }
                create_rule:
                  description: Also save a rule from this choice ("Always do this for …").
                  $ref: '#/components/schemas/RuleInput'
      responses:
        '200':
          description: Confirmed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /transactions/confirm:
    post:
      tags: [Transactions]
      operationId: confirmTransactions
      summary: Confirm several pending items at once
      x-milestone: M3
      x-stories: [US-11]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  maxItems: 200
                  items: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Which ones were confirmed
          content:
            application/json:
              schema:
                type: object
                required: [confirmed, skipped]
                properties:
                  confirmed: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
                  skipped:
                    description: Items that need a decision first (e.g. an open duplicate).
                    type: array
                    items: { $ref: '#/components/schemas/Uuid' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /transfers:
    post:
      tags: [Transactions]
      operationId: createTransfer
      summary: Move money between two of the user's accounts
      description: Creates two confirmed legs sharing one `transfer_group_id`. The fee is added to the `out` leg.
      x-milestone: M2
      x-stories: [US-06]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferInput' }
      responses:
        '201': { $ref: '#/components/responses/Transfer' }
        '200': { $ref: '#/components/responses/Transfer' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /transfers/{group_id}:
    parameters:
      - name: group_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    patch:
      tags: [Transactions]
      operationId: updateTransfer
      summary: Update transfer
      x-milestone: M2
      x-stories: [US-08]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferInput' }
      responses:
        '200': { $ref: '#/components/responses/Transfer' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Transactions]
      operationId: deleteTransfer
      summary: Delete transfer
      x-milestone: M2
      x-stories: [US-08]
      responses:
        '204': { description: Both legs deleted }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------ capture & duplicates
  /capture/parsed:
    post:
      tags: [Capture]
      operationId: captureParsed
      summary: Save a message the app parsed on the device
      description: |
        Used by paste (v1), the iPhone Shortcut and Android SMS (v1.1). The raw text never leaves the phone.
        Creates a `pending_review` transaction (or `confirmed` if a rule has `auto_confirm`), updates the
        account's `last_reported_balance`, and runs the duplicate check. Sending the same `source_hash`
        again returns the existing row with `200`.
      x-milestone: M3
      x-stories: [US-09, US-12]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParsedMessage' }
      responses:
        '201': { $ref: '#/components/responses/TransactionSaved' }
        '200': { $ref: '#/components/responses/TransactionSaved' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /duplicates:
    get:
      tags: [Duplicates]
      operationId: listDuplicates
      summary: List duplicates
      x-milestone: M3
      x-stories: [US-12]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/DuplicateResolution' }
      responses:
        '200':
          description: Duplicate pairs with both transactions embedded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/DuplicateCandidate' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /duplicates/{id}/resolve:
    post:
      tags: [Duplicates]
      operationId: resolveDuplicate
      summary: Resolve duplicate
      description: |
        - `merge`: keeps one row. Bank reference, balance and fee come from the imported/parsed row; category,
          contact, project and note come from the row the user recorded. The other row gets `merged_into_id`.
        - `keep_both`: both stay; the pair is never suggested again.
        - `discard`: the new row is deleted.
      x-milestone: M3
      x-stories: [US-12]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [merge, keep_both, discard] }
      responses:
        '200':
          description: The surviving transaction
          content:
            application/json:
              schema:
                type: object
                required: [duplicate]
                properties:
                  duplicate: { $ref: '#/components/schemas/DuplicateCandidate' }
                  kept: { $ref: '#/components/schemas/Transaction' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------ imports
  /imports:
    get:
      tags: [Imports]
      operationId: listImports
      summary: List imports
      x-milestone: M3
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Past imports, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Import' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Imports]
      operationId: createImport
      summary: Start an import and get an upload URL
      description: The app PUTs the file to `upload_url` (valid 15 minutes, max 20 MB), then calls `/parse`. Files are deleted after 30 days.
      x-milestone: M3
      x-stories: [US-10]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id, institution, file_name, file_type]
              properties:
                id: { $ref: '#/components/schemas/Uuid' }
                account_id: { $ref: '#/components/schemas/Uuid' }
                institution: { $ref: '#/components/schemas/Provider' }
                file_name: { type: string, example: BK_statement_Oct2026.pdf }
                file_type: { type: string, enum: [csv, xlsx, pdf] }
                size_bytes: { type: integer, maximum: 20971520 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [import, upload_url, upload_expires_at]
                properties:
                  import: { $ref: '#/components/schemas/Import' }
                  upload_url: { type: string, format: uri }
                  upload_headers:
                    type: object
                    additionalProperties: { type: string }
                  upload_expires_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /imports/{id}:
    get:
      tags: [Imports]
      operationId: getImport
      summary: Poll an import's state
      x-milestone: M3
      x-stories: [US-10]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Import' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Imports]
      operationId: cancelImport
      summary: Cancel an import that isn't committed and delete its file
      x-milestone: M3
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Cancelled }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /imports/{id}/parse:
    post:
      tags: [Imports]
      operationId: parseImport
      summary: Parse the uploaded file (async)
      description: Moves to `parsing`, then `ready`, `needs_password`, `needs_mapping` or `failed`. Call again with the password or mapping. The password is used once and never stored.
      x-milestone: M3
      x-stories: [US-10]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string }
                mapping: { $ref: '#/components/schemas/ColumnMapping' }
                save_mapping: { type: boolean, default: true }
      responses:
        '202': { $ref: '#/components/responses/Import' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /imports/{id}/rows:
    get:
      tags: [Imports]
      operationId: listImportRows
      summary: List import rows
      x-milestone: M3
      x-stories: [US-10]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/ImportRowState' }
      responses:
        '200':
          description: Preview rows
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ImportRow' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /imports/{id}/rows/{rowId}:
    patch:
      tags: [Imports]
      operationId: updateImportRow
      summary: Skip or include a preview row before committing
      x-milestone: M3
      x-stories: [US-10]
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: rowId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { type: string, enum: [new, skipped] }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportRow' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /imports/{id}/commit:
    post:
      tags: [Imports]
      operationId: commitImport
      summary: Create transactions from the `new` rows
      description: Rows already recorded are skipped. Rows that need review become `pending_review` with a duplicate pair. Committing twice is a no-op.
      x-milestone: M3
      x-stories: [US-10]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Import' }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /statement-mappings:
    get:
      tags: [Imports]
      operationId: listStatementMappings
      summary: List statement mappings
      x-milestone: M3
      responses:
        '200':
          description: Saved column mappings
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/StatementMapping' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [Imports]
      operationId: saveStatementMapping
      summary: Create or replace the mapping for an institution and file type
      x-milestone: M3
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatementMapping' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatementMapping' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------ categories & rules
  /categories:
    get:
      tags: [Categories]
      operationId: listCategories
      summary: List categories
      x-milestone: M2
      parameters:
        - $ref: '#/components/parameters/UpdatedSince'
        - $ref: '#/components/parameters/IncludeDeleted'
      responses:
        '200':
          description: All categories (seeded defaults included)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Categories]
      operationId: createCategory
      summary: Create category
      x-milestone: M3
      x-stories: [US-13]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CategoryInput'
                - required: [name, direction]
      responses:
        '201': { $ref: '#/components/responses/Category' }
        '200': { $ref: '#/components/responses/Category' }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /categories/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Categories]
      operationId: updateCategory
      summary: Update category
      x-milestone: M3
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '200': { $ref: '#/components/responses/Category' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Categories]
      operationId: deleteCategory
      summary: Delete category
      description: System categories can't be deleted (`409 system_category`). Pass `move_to` to recategorize existing transactions; otherwise they become uncategorized.
      x-milestone: M3
      parameters:
        - name: move_to
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /rules:
    get:
      tags: [Rules]
      operationId: listRules
      summary: List rules
      x-milestone: M3
      x-stories: [US-13]
      parameters:
        - $ref: '#/components/parameters/UpdatedSince'
        - $ref: '#/components/parameters/IncludeDeleted'
      responses:
        '200':
          description: Rules in priority order
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Rule' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Rules]
      operationId: createRule
      summary: Create rule
      x-milestone: M3
      x-stories: [US-13]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/RuleInput'
                - required: [match_text]
                - properties:
                    apply_to_existing:
                      type: boolean
                      default: false
                      description: Also update past confirmed transactions that match.
      responses:
        '201': { $ref: '#/components/responses/Rule' }
        '200': { $ref: '#/components/responses/Rule' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /rules/preview:
    post:
      tags: [Rules]
      operationId: previewRule
      summary: How many past transactions a rule would match, before saving it
      x-milestone: M3
      x-stories: [US-13]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleInput' }
      responses:
        '200': { $ref: '#/components/responses/RuleMatches' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /rules/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Rules]
      operationId: updateRule
      summary: Update rule
      x-milestone: M3
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleInput' }
      responses:
        '200': { $ref: '#/components/responses/Rule' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Rules]
      operationId: deleteRule
      summary: Delete rule
      x-milestone: M3
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /rules/{id}/matches:
    get:
      tags: [Rules]
      operationId: getRuleMatches
      summary: Get rule matches
      x-milestone: M3
      x-stories: [US-13]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/RuleMatches' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------ contacts
  /contacts:
    get:
      tags: [Contacts]
      operationId: listContacts
      summary: List contacts
      x-milestone: M4
      x-stories: [US-17]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/UpdatedSince'
        - $ref: '#/components/parameters/IncludeDeleted'
