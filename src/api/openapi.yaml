                        limit: { type: integer, format: int64, example: 250000 }
                        spent: { type: integer, format: int64, example: 212500 }
                        state: { type: string, enum: [ok, near, over], description: 'near ≥ first threshold, over ≥ 100%.' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
